# Render Blueprint for FearSensiZ
# Static site — koi build step nahi, koi server nahi.
# Deploy: Render Dashboard -> New + -> Blueprint -> repo chuno -> Apply.
services:
  - type: web
    name: fearsensiz
    runtime: static
    repo: https://github.com/sahilalamx07-afk/FearSensiZ
    branch: main
    buildCommand: ""
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=600
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
